[package]
name = "core-ftp"
version = "0.1.0"
description = "A lightweight FTP client with remote extraction support"
authors = ["milusvip"]
license = "MIT"
edition = "2021"

[lib]
name = "core_ftp_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
suppaftp = { version = "5", features = ["native-tls"] }
native-tls = "0.2"
ssh2 = "0.9"
# 必须启用平台 feature，否则回退到 mock（仅内存，重启后密码丢失）
keyring = { version = "3", features = ["windows-native", "apple-native"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
dirs-next = "2"
open = "5"
